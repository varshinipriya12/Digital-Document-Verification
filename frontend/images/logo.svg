<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Navy Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Inner Gold Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FCD34D" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Center Shield Emblem -->
  <path d="M100,38 L142,56 C142,105 125,138 100,154 C75,138 58,105 58,56 L100,38 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)"/>

  <!-- Document Icon Inside Shield -->
  <rect x="82" y="65" width="36" height="48" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="90" y1="76" x2="110" y2="76" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="84" x2="110" y2="84" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="92" x2="104" y2="92" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Verification Checkmark Shield Badge -->
  <circle cx="118" cy="115" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M110,115 L116,120 L126,109" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
